syntax = "proto3";
package vector.vector.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "vector/vector/v1/params.proto";

option go_package = "vector/x/vector/types";

// GenesisState defines the vector module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

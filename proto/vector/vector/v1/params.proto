syntax = "proto3";
package vector.vector.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "vector/x/vector/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "vector/x/vector/Params";
  option (gogoproto.equal) = true;
}
